{% extends 'base.html' %}

{% block title %}Register | SkyPulse Weather System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 text-center">
                    <div class="brand-icon d-inline-block p-3 rounded-circle bg-white-10 mb-2">
                        <i class="fa-solid fa-user-plus fs-3 text-warning"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Create Account</h4>
                    <p class="text-white-50 small mb-0">Join the Cloud Weather Information Management System</p>
                </div>
                
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
                                    <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="john_doe" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Default City</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-city text-muted"></i></span>
                                    <input type="text" name="default_city" class="form-control" value="New York" placeholder="New York">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Preferred Temperature Unit</label>
                                <select name="preferred_units" class="form-select">
                                    <option value="metric" selected>Metric (°C, m/s)</option>
                                    <option value="imperial">Imperial (°F, mph)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-check-double text-muted"></i></span>
                                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-semibold rounded-3 shadow-sm">
                            <i class="fa-solid fa-check me-2"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none ms-1">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
